<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças Casa</title>
<meta name="theme-color" content="#1F4E5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças Casa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#1F4E5F;overflow:hidden}
  iframe{border:0;width:100%;height:100%;display:block;background:#F4F1EC}
  #wrap{position:fixed;inset:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#1F4E5F}
  #ajuda{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#1F4E5F}
  #ajuda a,#ajuda button{display:inline-block;background:#fff;color:#1F4E5F;border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;font-size:15px}
  #ajuda small{opacity:.75}
  #carregar{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:14px -apple-system,Segoe UI,Roboto,sans-serif;background:#1F4E5F;pointer-events:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="wrap"><iframe id="app" src="https://script.google.com/macros/s/AKfycbyXcX6Y0Az9VpIcYfR6eOuxpU1F63-W8ffmML1crA-7EjDDE2eF2gySzavAyE81ByQsOw/exec" allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
<div id="carregar">A abrir Finanças Casa…</div>
<div id="ajuda">
  <b style="font-size:18px">Precisas de iniciar sessão na Google</b>
  <span>Toca no botão, entra com a tua conta, e depois volta a abrir a app.</span>
  <a href="https://script.google.com/macros/s/AKfycbyXcX6Y0Az9VpIcYfR6eOuxpU1F63-W8ffmML1crA-7EjDDE2eF2gySzavAyE81ByQsOw/exec" target="_blank" rel="noopener">Iniciar sessão</a>
  <button onclick="location.reload()">Já entrei — recarregar</button>
  <small>Isto só acontece na primeira vez ou quando a sessão Google expira.</small>
</div>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  const f = document.getElementById('app'), c = document.getElementById('carregar'), h = document.getElementById('ajuda');
  let ok = false;
  f.addEventListener('load', () => { ok = true; c.style.opacity = 0; setTimeout(()=>c.style.display='none', 350); });
  // Se a app não carregar em 12 s, é quase sempre a sessão Google em falta (a página de login não abre dentro de uma app).
  setTimeout(() => { if (!ok) { c.style.display = 'none'; h.style.display = 'flex'; } }, 12000);
  // Botão "Ajuda" discreto: tocar 3x no topo mostra o ecrã de sessão
  let taps = 0; document.getElementById('wrap').addEventListener('click', e => { if (e.clientY < 30 && ++taps >= 3) { h.style.display = 'flex'; taps = 0; } });
</script>
</body>
</html>
